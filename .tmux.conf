##### General #####
# # Prefix
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# vi
setw -g mode-keys vi

# Fast escape
set -sg escape-time 0

# History
set -g history-limit 100000

# Start numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Focus events (Vim等との連携用)
set -g focus-events on

##### Terminal #####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

##### Mouse #####
set -g mouse on

# ##### Splits #####
# unbind '"'
# unbind %
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"

##### Reload #####
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

##### Resize #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Pane movement #####
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### Colors (パレット) #####
# accent : colour39  (ブルー)
# accent2: colour214 (オレンジ / 現在ウィンドウ強調)
# bg     : colour235 (濃いグレー)
# bg2    : colour238
# fg     : colour250
# muted  : colour244

##### Status Bar #####
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=colour235,fg=colour250"

# 左側: セッション名をパワーライン風セグメントで
set -g status-left-length 40
set -g status-left "#[bg=colour39,fg=colour235,bold]  #S #[bg=colour235,fg=colour39]"

# 右側: ホスト名 + 日時をセグメントで
set -g status-right-length 60
set -g status-right "#[fg=colour238]#[bg=colour238,fg=colour250]  #h #[fg=colour39,bg=colour238]#[bg=colour39,fg=colour235,bold] %Y-%m-%d %H:%M "

##### Windows #####
setw -g window-status-format "#[fg=colour244] #I #W "
setw -g window-status-current-format "#[fg=colour235,bg=colour214]#[fg=colour235,bg=colour214,bold]  #I:#W  #[fg=colour214,bg=colour235]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=colour39,bg=colour235"

##### Borders #####
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

##### Messages / Command line #####
set -g message-style bg=colour39,fg=colour235,bold
set -g message-command-style bg=colour238,fg=colour250

##### Clock mode #####
setw -g clock-mode-colour colour39
